<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王璋诺的网站</title>
    <link rel="icon" href="王璋诺的网站样式与动画设计.png" type="image/png">
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-image: url('王璋诺的网站.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(30, 136, 229, 0.7);
            z-index: -1;
        }

        .top-left-container {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            z-index: 10;
            animation: fadeInDown 0.8s ease-out forwards;
        }

        .wzn-logo {
            color: #ffffff;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
        }

        .top-btn {
            padding: 8px 16px;
            background-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            animation: fadeIn 0.6s ease-out forwards;
        }

        .top-btn:nth-child(2) { animation-delay: 0.1s; }
        .top-btn:nth-child(3) { animation-delay: 0.2s; }
        .top-btn:nth-child(4) { animation-delay: 0.3s; }
        .top-btn:nth-child(5) { animation-delay: 0.4s; }

        .panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 100%;
            max-width: 360px;
            background: rgba(0, 70, 140, 0.95);
            border-radius: 10px;
            padding: 22px;
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
            z-index: 999;
            display: none;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .panel.show {
            display: block;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* 工具箱面板加宽 */
        #toolPanel {
            max-width: 800px;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .panel-title {
            color: #fff;
            font-size: 26px;
            text-align: center;
            margin-bottom: 18px;
            margin-right: 30px;
            user-select: none;
            opacity: 0;
            animation: fadeIn 0.5s ease-out 0.2s forwards;
        }

        .panel-btn {
            display: block;
            width: 100%;
            padding: 13px 0;
            margin: 8px 0;
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInUp 0.4s ease-out forwards;
        }

        /* 工具箱内部样式 */
        .tool-row {
            display: flex;
            gap: 16px;
            margin-top: 10px;
        }
        .tool-col {
            flex: 1;
        }
        .tool-subtitle {
            color: #fff;
            font-size: 16px;
            margin-bottom: 8px;
            text-align: center;
        }
        textarea, input {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border-radius: 6px;
            border: none;
            font-size: 14px;
        }
        .tool-btn {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 4px 0;
        }
        iframe {
            width: 100%;
            height: 200px;
            border-radius: 6px;
            background: #fff;
            border: none;
        }

        #gamePanel .panel-btn:nth-child(3) { animation-delay: 0.2s; }
        #gamePanel .panel-btn:nth-child(4) { animation-delay: 0.3s; }
        #gamePanel .panel-btn:nth-child(5) { animation-delay: 0.4s; }
        #gamePanel .panel-btn:nth-child(6) { animation-delay: 0.5s; }
        #gamePanel .panel-btn:nth-child(7) { animation-delay: 0.6s; }
        #gamePanel .panel-btn:nth-child(8) { animation-delay: 0.7s; }
        #gamePanel .panel-btn:nth-child(9) { animation-delay: 0.8s; }

        #otherPanel .panel-btn:nth-child(3) { animation-delay: 0.2s; }
        #otherPanel .panel-btn:nth-child(4) { animation-delay: 0.3s; }
        #otherPanel .panel-btn:nth-child(5) { animation-delay: 0.4s; }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 998;
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .overlay.show {
            display: block;
            opacity: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .wzn-logo:hover {
            color: #cccccc;
            transform: scale(1.05);
        }
        .top-btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px) scale(1.05);
        }
        .panel-btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-4px) scale(1.02);
        }
        .close-btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg) scale(1.1);
        }

        @media (max-width: 768px) {
            .tool-row {
                flex-direction: column;
            }
            #toolPanel {
                max-width: 95%;
            }
        }
    </style>
</head>
<body>

<div class="top-left-container">
    <div class="wzn-logo" id="wznLink">王璋诺的网站</div>
    <button class="top-btn" id="gameToggleBtn">游戏</button>
    <button class="top-btn" id="otherToggleBtn">其他功能</button>
    <button class="top-btn" id="toolToggleBtn">工具箱</button> <!-- 新增按钮 -->
    <button class="top-btn" id="baiduBtn">关于</button>
</div>

<div class="overlay" id="overlay"></div>

<!-- 游戏面板 -->
<div class="panel" id="gamePanel">
    <button class="close-btn" id="gameCloseBtn">×</button>
    <div class="panel-title">🎮 游戏专区</div>
    <button class="panel-btn" id="btn1">玩我的世界</button>
    <button class="panel-btn" id="btn2">看视频</button>
    <button class="panel-btn" id="mc2dBtn">2d我的世界</button>
    <button class="panel-btn" id="snakeBtn">玩贪吃蛇</button>
    <button class="panel-btn" id="marioBtn">马里奥</button>
    <button class="panel-btn" id="catBtn">闯关游戏</button>
    <button class="panel-btn" id="pvzBtn">植物大战僵尸</button>
    <button class="panel-btn" id="amongusBtn">太空狼人杀</button>
</div>

<!-- 其他功能面板 -->
<div class="panel" id="otherPanel">
    <button class="close-btn" id="otherCloseBtn">×</button>
    <div class="panel-title">🔧 其他功能</div>
    <button class="panel-btn" id="downloadBtn">下载文件</button>
    <button class="panel-btn" id="navHomeBtn">导航主页</button>
    <button class="panel-btn" id="calcBtn">计算器</button>
</div>

<!-- 工具箱面板 -->
<div class="panel" id="toolPanel">
    <button class="close-btn" id="toolCloseBtn">×</button>
    <div class="panel-title">🧰 工具箱</div>
    <div class="tool-row">
        <div class="tool-col">
            <div class="tool-subtitle">Base64 转换</div>
            <textarea id="textInput" placeholder="输入文字" rows="3"></textarea>
            <button class="tool-btn" onclick="textToBase64()">文字 → Base64</button>
            <button class="tool-btn" onclick="base64ToText()">Base64 → 文字</button>
            <textarea id="base64Output" placeholder="输出结果" rows="3"></textarea>
        </div>
        <div class="tool-col">
            <div class="tool-subtitle">HTML 在线运行</div>
            <input type="file" id="htmlFile" accept=".html">
            <button class="tool-btn" onclick="loadHtmlFile()">运行 HTML</button>
            <iframe id="htmlPreview"></iframe>
        </div>
    </div>
</div>

<script>
    const gameToggleBtn = document.getElementById('gameToggleBtn');
    const gamePanel = document.getElementById('gamePanel');
    const gameCloseBtn = document.getElementById('gameCloseBtn');
    
    const otherToggleBtn = document.getElementById('otherToggleBtn');
    const otherPanel = document.getElementById('otherPanel');
    const otherCloseBtn = document.getElementById('otherCloseBtn');
    
    const toolToggleBtn = document.getElementById('toolToggleBtn');
    const toolPanel = document.getElementById('toolPanel');
    const toolCloseBtn = document.getElementById('toolCloseBtn');
    
    const overlay = document.getElementById('overlay');
    const allPanels = document.querySelectorAll('.panel');

    function hideAllPanels() {
        allPanels.forEach(p => p.classList.remove('show'));
        overlay.classList.remove('show');
        setTimeout(() => { document.body.style.overflow = 'auto'; }, 400);
    }

    function showPanel(panel) {
        hideAllPanels();
        panel.classList.add('show');
        overlay.classList.add('show');
        document.body.style.overflow = 'hidden';
    }

    // 顶部按钮
    document.getElementById('wznLink').onclick = () => location.href = 'https://wzn.pages.dev';
    document.getElementById('baiduBtn').onclick = () => location.href = 'https://wzn.pages.dev/about';

    // 开关
    gameToggleBtn.onclick = () => showPanel(gamePanel);
    gameCloseBtn.onclick = hideAllPanels;

    otherToggleBtn.onclick = () => showPanel(otherPanel);
    otherCloseBtn.onclick = hideAllPanels;

    toolToggleBtn.onclick = () => showPanel(toolPanel);
    toolCloseBtn.onclick = hideAllPanels;

    overlay.onclick = hideAllPanels;
    document.addEventListener('keydown', e => e.key === 'Escape' && hideAllPanels());

    // 游戏跳转
    document.getElementById('btn1').onclick = () => location.href = 'https://play.mcjs.cc/1.8.8/';
    document.getElementById('btn2').onclick = () => location.href = 'https://www.bilibili.com';
    document.getElementById('mc2dBtn').onclick = () => location.href = 'https://wzn.pages.dev/mc';
    document.getElementById('snakeBtn').onclick = () => location.href = 'https://wzn.pages.dev/snake';
    document.getElementById('marioBtn').onclick = () => location.href = 'https://www.n1mariogames.com/';
    document.getElementById('catBtn').onclick = () => location.href = 'https://wzn.pages.dev/hengbanguoguan/';
    document.getElementById('pvzBtn').onclick = () => location.href = 'http://jspvz.com/plantsvszombies.htm';
    document.getElementById('amongusBtn').onclick = () => location.href = 'https://amongus-online.net/game/amongus';

    // 其他功能
    document.getElementById('downloadBtn').onclick = () => location.href = 'https://wzn.pages.dev/download';
    document.getElementById('navHomeBtn').onclick = () => location.href = 'https://wzn.pages.dev/daohang';
    document.getElementById('calcBtn').onclick = () => location.href = 'https://wzn.pages.dev/jisuanqi';

    // 工具箱功能
    function textToBase64() {
        const t = document.getElementById('textInput').value;
        document.getElementById('base64Output').value = btoa(unescape(encodeURIComponent(t)));
    }
    function base64ToText() {
        try {
            const b = document.getElementById('base64Output').value;
            document.getElementById('textInput').value = decodeURIComponent(escape(atob(b)));
        } catch(e) { alert('格式错误'); }
    }
    function loadHtmlFile() {
        const f = document.getElementById('htmlFile').files[0];
        if(!f) return alert('请选择文件');
        const r = new FileReader();
        r.onload = e => document.getElementById('htmlPreview').srcdoc = e.target.result;
        r.readAsText(f);
    }
</script>
</body>
</html>
